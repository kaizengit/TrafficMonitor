name: Build x64

on:
  push:
  workflow_dispatch:

jobs:

  x64_build:
    # windows-latest 已切到 VS 2026（v180 目标），找不到 v143 且默认不带 MFC，
    # 因此锁定 windows-2022（VS 2022 17.14 + ATLMFC），与作者发布 V1.86 时的环境一致
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 环境诊断
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        "=== VS 实例 ==="
        & $vswhere -all -products * -property installationPath
        "=== afxres.h ==="
        Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Filter afxres.h -Recurse -ErrorAction SilentlyContinue |
          ForEach-Object { $_.FullName }
        "=== mfc140u.lib ==="
        Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Filter mfc140u.lib -Recurse -ErrorAction SilentlyContinue |
          ForEach-Object { $_.FullName }

    - name: 补装 MFC（仅缺失时执行）
      shell: pwsh
      run: |
        $mfc = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Filter mfc140u.lib -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($mfc) { "MFC 已存在，跳过安装"; exit 0 }
        "未找到 MFC，尝试补装"
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        $instPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        $argList = @(
          "modify",
          "--installPath", "`"$instPath`"",
          "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC",
          "--quiet", "--norestart", "--nocache"
        )
        $p = Start-Process -FilePath $installer -ArgumentList $argList -Wait -PassThru
        "安装器退出码: $($p.ExitCode)"

    - name: MSBuild
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
        "MSBuild: $msbuild"
        & $msbuild TrafficMonitor.sln /p:configuration=release /p:platform=x64 /p:platformToolset=v143 /m /nologo /v:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: 上传 exe
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor_x64
        path: |
          Bin/x64/Release/TrafficMonitor.exe
          Bin/x64/Release/*.dll
        if-no-files-found: error

    - name: 上传 pdb
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor_x64_pdb
        path: Bin/x64/Release/*.pdb
        if-no-files-found: warn
